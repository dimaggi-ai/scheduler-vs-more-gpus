name: Orbital network contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Network and coupled-state contracts
        run: python3 -m unittest capacity.orbital.test_network capacity.orbital.test_dynamics -v
