name: Orbital checkpoint mission contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkpoint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest capacity.orbital.test_checkpoint_mission capacity.orbital.test_reliability capacity.orbital.test_platform -v
