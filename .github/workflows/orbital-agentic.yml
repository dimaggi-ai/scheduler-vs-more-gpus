name: Orbital agentic contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  agentic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing planner and agent-callable contracts
        run: python -m unittest capacity.orbital.test_orbital capacity.orbital.test_agentic -v
