name: Orbital synthetic fleet contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fleet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest capacity.orbital.test_fleet capacity.orbital.test_diligence -v
