name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r sim/requirements.txt
      - name: Calculator tests
        run: python3 calculator/test_stranded_capacity.py
      - name: Simulator invariants
        run: cd sim && python3 test_sim.py
      - name: Validation registry (model vs public record)
        run: cd sim && python3 test_validation.py && python3 validation.py
